function stats(){let h='<h2>Trainingsübersicht</h2>';const count=Object.values(S.log).filter(v=>v&&v.d).length;h+=`<div class="grid"><div class="panel"><div class="stat">${count}</div><small>Erledigte Einträge inkl. Warm-up</small></div><div class="panel"><div class="stat">${S.sessions.length}</div><small>Beendete Timer-Sessions</small></div></div><h2>Gewichtsentwicklung</h2>`;D.forEach((d,di)=>d.e.forEach((x,i)=>{const weeks=[...new Set(Object.keys(S.log).map(k=>Number(k.split("|")[0])).filter(w=>w>0))].sort((a,b)=>a-b);const vals=weeks.map(w=>Math.max(0,...Array.from({length:x[1]},(_,s)=>{const v=rd(key(w,di,i,s));return v.d?num(v.w)||0:0})));const max=Math.max(...vals);if(max)h+=`<div class="panel"><b>${x[0]} · ${d.t}</b>${vals.map((v,j)=>`<div class="flex"><small>W${weeks[j]}</small><div style="flex:1"><div class="bar" style="width:${100*v/max}%"></div></div><small>${v?v+' kg':'–'}</small></div>`).join('')}</div>`}));h+='<h2>Historie</h2>';if(!S.sessions.length)h+='<p class="muted">Noch keine neu beendeten Sessions.</p>';S.sessions.slice().reverse().forEach(s=>{const [w,d]=String(s.key).split('|');h+=`<div class="panel"><b>Woche ${esc(w)} · ${esc(D[d]?.n||'Training')}</b><br><small>${esc(new Date(s.end).toLocaleString('de-DE'))} · ${fmt(s.seconds)}</small></div>`});h+='<h3>Frühere Zeitmessungen</h3>';Object.entries(S.dur).forEach(([k,v])=>{const [w,d]=k.split('|');h+=`<p>W${esc(w)} · ${esc(D[d]?.n||'Training')} · ${fmt(v)}</p>`});$('#history').innerHTML=h}
function startRest(s){restSecs=s;restEnd=Date.now()+s*1000;tick()}function tick(){const r=S.running;$('#session').textContent=r?'Training beenden':'Training starten';$('#sessionTime').textContent=r?fmt((Date.now()-r.start)/1000):fmt(S.dur[prefix()]||0);$('#restTime').textContent=fmt(Math.ceil((restEnd-Date.now())/1000));$('#restLabel').textContent=restEnd&&restEnd<=Date.now()?'Pause beendet': 'Satzpause';$('#restStart').textContent=restSecs+' s Pause'}setInterval(tick,250);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==="weekJump"){const w=Number(prompt("Zu welcher Trainingswoche wechseln?",S.week));if(Number.isSafeInteger(w)&&w>0&&w<=10000){S.week=w;save();render()}}else if(b.id==="deload"){S.deload=S.deload||{};S.deload[S.week]=!S.deload[S.week];save();render()}else if(b.dataset.view){view=b.dataset.view;['train','history','settings'].forEach(v=>$('#'+v).hidden=v!==view);document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));if(view==='history')stats()}else if(b.dataset.week||b.dataset.day!==undefined){if(b.dataset.week)S.week=+b.dataset.week;else S.day=+b.dataset.day;save();render()}else if(b.dataset.pause)startRest(+b.dataset.pause)});document.addEventListener('input',e=>{const t=e.target;if(t.dataset.m){S.mx[t.dataset.m]=t.value;save()}else if(t.dataset.k){const v=S.log[t.dataset.k]||(S.log[t.dataset.k]={});v[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;save();progress();if(t.checked&&t.dataset.rest)startRest(+t.dataset.rest)}});$('#session').onclick=()=>{if(S.running){const r=S.running,end=Date.now(),seconds=Math.round((end-r.start)/1000);S.dur[r.key]=seconds;S.sessions.push({key:r.key,start:r.start,end,seconds});delete S.running}else S.running={key:prefix(),start:Date.now()};save();tick()};$('#restStart').onclick=()=>startRest(restSecs);$('#restStop').onclick=()=>{restEnd=0;tick()};$('#reset').onclick=()=>{if(confirm('Alle Einträge dieses Tages löschen?')){Object.keys(S.log).filter(k=>k.startsWith(prefix()+'|')).forEach(k=>delete S.log[k]);save();render()}};function maxes(){$('#maxes').innerHTML=[['bp','Bankdrücken'],['pp','Push Press']].map(([k,n])=>`<label class="set"><span>${n}</span><input class="rm" data-m="${k}" inputmode="decimal" value="${esc(S.mx[k])}" placeholder="kg"></label>`).join('')}$('#export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=u;a.download='rb-training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!valid(o))throw Error();if(confirm('Lokale Daten durch Backup ersetzen?')){load(o);save();maxes();render()}}catch(e){alert('Backup konnte nicht gelesen werden.')}finally{$('#file').value=''}};maxes();render();
</script></body></html>
