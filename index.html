<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RB Training"><meta name="theme-color" content="#080808"><title>RB Training | Black &amp; Gold</title><style>

ight:800;font-variant-numeric:tabular-nums}.tag{font-size:12px;color:var(--accent);font-weight:700}summary{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}.stat{font-size:28px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .panel{margin:0}.bar{height:10px;background:var(--accent);border-radius:5px}.done{border-color:var(--green)}[hidden]{display:none!important}

</style></head><body><main><div class="eyebrow">PADERBORN DOLPHINS / PERFORMANCE</div><h1>RB OFF-SEASON</h1><p class="muted">Strength · Power · Athleticism</p><div class="flex" id="nav"><button data-view="train" class="active">Training</button><button data-view="history">Historie & Stats</button><button data-view="settings">Einstellungen</button></div><section id="train"><div class="tabs" id="weeks"></div><p id="hint" class="muted"></p><div class="tabs" id="days"></div><div class="panel"><div class="flex spread"><b id="dayname"></b><span id="progressText"></span></div><div class="progress"><i id="progressBar"></i></div><div class="flex spread" style="margin-top:12px"><button id="session" class="primary">Training starten</button><span id="sessionTime" class="clock">0:00</span></div></div><div id="work"></div><button id="reset">Diesen Tag zurücksetzen</button></section><section id="history" hidden></section><section id="settings" hidden><div class="panel"><h2>Referenzgewichte</h2><p class="muted">Optional: bekanntes 1RM eintragen, kein Maximaltest nötig.</p><div id="maxes"></div></div><div class="panel"><h2>Datensicherung</h2><p>Deine Daten bleiben lokal in diesem Browser. Exportiere sie für einen Gerätewechsel.</p><button id="export">Backup exportieren</button> <button id="import">Backup importieren</button><input type="file" id="file" accept="application/json,.json" hidden><p id="storageStatus" role="status"></p></div></section></main><div class="dock"><div class="flex spread"><div><small id="restLabel">Satzpause</small><div class="clock" id="restTime">0:00</div></div><button id="restStop">Stopp</button><button id="restStart" class="primary">90 s Pause</button></div></div><script>
'use strict';const K='rb-plan-v1', $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lower=[['Glute Bridge','2×12'],['Band Walk','2×10 pro Seite'],['Leg Swings','2×10 pro Bein'],['Walking Lunge mit Rotation','2×6 pro Bein'],['A-Skips','2×15 m']],upper=[['Arm Circles','2×10 je Richtung'],['Band Pull-Apart','2×15'],['Scapula Push-Up','2×10'],['Liegestütze','2×8'],['Brustwirbel-Rotation','2×8 pro Seite']];
// Stable exercise indices preserve original logs. Replacements use separate keys.
const D=[{t:'Mo',n:'Lower Strength',e:[['Box Jump',5,'4',90,'','Leise landen, jede Wiederholung einzeln.'],['Beinpresse',4,'8',120,'','Kontrolliert absenken, Becken bleibt an der Lehne.'],['Romanian Deadlift',3,'8',90,'','Hüfte nach hinten, Rücken neutral.'],['Bulgarian Split Squat',3,'8 pro Bein',90,'','Kurzhanteln seitlich halten, kontrolliert und nur schmerzfrei trainieren.'],['Beinbeuger Maschine',3,'10',90,'','Langsam ablassen, Hüfte stabil.',1],['Standing Calf Raise',3,'12',60],['Plank',3,'40 Sek',60]]},{t:'Di',n:'Upper Strength',e:[['Medizinball-Brustwurf',3,'5',90],['Bankdrücken',4,'5',150,'bp'],['Klimmzüge',4,'6–8',120],['Schrägbankdrücken mit Kurzhanteln',3,'8',90],['Vorgebeugtes Rudern',3,'8',90],['Face Pull',3,'15',60],['Bizepscurl und Trizepsdrücken (Superset)',2,'12',60]]},{t:'Do',n:'Upper Power',e:[['Push Press',4,'5',120,'pp','Kurzer Dip, explosiver Beinantrieb.'],['Dips oder Schrägbankdrücken',3,'8',90],['Einarm-Kurzhantelrudern',3,'10 pro Seite',90],['Latzug',3,'10',90],['Seitheben',3,'15',60],['Nackentraining',2,'15',60,'','Leichter kontrollierter Widerstand, keine ruckartigen Bewegungen.'],['Farmer’s Carry',3,'30 m',60]]},{t:'Sa',n:'Lower Power',note:'Nach Platztraining Sprünge und Würfe nur bei frischen Beinen. Bei Müdigkeit reduzieren oder auslassen.',e:[['Box Jump',3,'3',90],['Medizinball Scoop Toss',3,'5',120,'','Explosiv aus der Hüfte nach vorne/oben werfen, freie Wurfzone.',1],['Broad Jump',3,'3',90],['Lateral Bound',3,'5 pro Seite',90],['Hip Thrust',4,'8',90],['Walking Lunge',3,'10 pro Bein',90],['Sled Push',5,'15 m',90],['Copenhagen Plank',3,'20 Sek pro Seite',60],['Pallof Press',3,'10 pro Seite',60]]}];
const hints=['Einstieg · Kraftübungen RPE 7 (3 Wiederholungen Reserve)','Aufbau · Kraftübungen RPE 8 (2 Wiederholungen Reserve)','Peak · Kraftübungen maximal RPE 9 (1 Wiederholung Reserve)','Deload · weniger Sätze, leichter trainieren'];let S={week:1,day:0,log:{},mx:{},dur:{},sessions:[]};function valid(o){return o&&typeof o==='object'&&o.log&&typeof o.log==='object'&&!Array.isArray(o.log)}function load(o){if(!valid(o))throw Error('Ungültiges Backup');S={...S,...o};S.week=Math.min(4,Math.max(1,Number(S.week)||1));S.day=Math.min(3,Math.max(0,Number(S.day)||0));S.mx=S.mx||{};S.dur=S.dur||{};S.sessions=Array.isArray(S.sessions)?S.sessions:[];if(S.t&&!S.running)S.running={key:S.week+'|'+S.day,start:S.t};delete S.t}try{const raw=localStorage.getItem(K);if(raw)load(JSON.parse(raw))}catch(e){alert('Alte Daten konnten nicht geladen werden.')}function save(){try{localStorage.setItem(K,JSON.stringify(S));$('#storageStatus').textContent='Lokal gespeichert.'}catch(e){$('#storageStatus').textContent='Speichern fehlgeschlagen. Bitte Backup exportieren.'}}const num=x=>Number(String(x??'').replace(',','.')),round=x=>Math.round(x/2.5)*2.5,rd=k=>S.log[k]||{},prefix=()=>S.week+'|'+S.day, key=(w,d,i,s)=>`${w}|${d}|${D[d].e[i][6]?'v2-':''}${i}|${s}`, fmt=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};let restEnd=0,restSecs=90,view='train';
function target(x,i,s){const m=num(S.mx[x[4]]);if(x[4]&&m>0)return round(m*[.725,.775,.825,.6][S.week-1]);if(S.week===1)return '';const p=rd(key(S.week-1,S.day,i,s)),v=num(p.w);return v>0?(S.week===4?round(v*.8):v):''}function video(n){return `<a target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=${encodeURIComponent(n+' exercise technique')}">Technik ↗</a>`}function render(){ $('#weeks').innerHTML=[1,2,3,4].map(w=>`<button data-week="${w}" class="${w===S.week?'active':''}">W ${w}</button>`).join('');$('#days').innerHTML=D.map((d,i)=>`<button data-day="${i}" class="${i===S.day?'active':''}">${d.t}</button>`).join('');const d=D[S.day];$('#hint').textContent=hints[S.week-1];$('#dayname').textContent=d.n;let h=d.note?`<p class="panel">${d.note}</p>`:'';h+='<h2>01 / Warm-up</h2><div class="panel">';(S.day===0||S.day===3?lower:upper).forEach((x,i)=>{const k=prefix()+'|w'+i;h+=`<label class="warm"><input type="checkbox" data-k="${k}" data-f="d" ${rd(k).d?'checked':''}><span>${x[0]}<br><small>${x[1]}</small></span></label>`});h+='</div><h2>02 / Workout</h2>';d.e.forEach((x,i)=>{const n=S.week===4?Math.min(2,x[1]):x[1];h+=`<article><div class="tag">ÜBUNG ${String(i+1).padStart(2,'0')}</div><div class="flex spread"><h3>${x[0]}</h3>${video(x[0])}</div><p class="muted">${n} × ${x[2]} · ${x[3]} s Pause</p>${x[5]?`<p>${x[5]}</p>`:''}<div class="set muted"><small>Satz</small><small>Gewicht (kg)</small><small>Wdh / Zeit / m</small></div>`;for(let s=0;s<n;s++){const k=key(S.week,S.day,i,s),v=rd(k),t=target(x,i,s);h+=`<div class="set"><label><input type="checkbox" data-k="${k}" data-f="d" data-rest="${x[3]}" ${v.d?'checked':''}> ${s+1}</label><input aria-label="Gewicht Satz ${s+1}" inputmode="decimal" data-k="${k}" data-f="w" value="${esc(v.w)}" placeholder="${t||'kg'}"><input aria-label="Leistung Satz ${s+1}" inputmode="decimal" data-k="${k}" data-f="r" value="${esc(v.r)}" placeholder="${esc(x[2])}"></div>`}h+=`<button data-pause="${x[3]}">Pause ${x[3]} s</button></article>`});$('#work').innerHTML=h;progress();tick()}
function progress(){const a=[...document.querySelectorAll('#work input[type=checkbox]')],n=a.filter(x=>x.checked).length;$('#progressText').textContent=n+'/'+a.length;$('#progressBar').style.width=(a.length?n/a.length*100:0)+'%';document.querySelectorAll('article').forEach(a=>{const c=[...a.querySelectorAll('[type=checkbox]')];a.classList.toggle('done',c.length>0&&c.every(x=>x.checked))})}
function stats(){let h='<h2>Trainingsübersicht</h2>';const count=Object.values(S.log).filter(v=>v&&v.d).length;h+=`<div class="grid"><div class="panel"><div class="stat">${count}</div><small>Erledigte Einträge inkl. Warm-up</small></div><div class="panel"><div class="stat">${S.sessions.length}</div><small>Beendete Timer-Sessions</small></div></div><h2>Gewichtsentwicklung</h2>`;D.forEach((d,di)=>d.e.forEach((x,i)=>{const vals=[1,2,3,4].map(w=>Math.max(0,...Array.from({length:x[1]},(_,s)=>{const v=rd(key(w,di,i,s));return v.d?num(v.w)||0:0})));const max=Math.max(...vals);if(max)h+=`<div class="panel"><b>${x[0]} · ${d.t}</b>${vals.map((v,j)=>`<div class="flex"><small>W${j+1}</small><div style="flex:1"><div class="bar" style="width:${100*v/max}%"></div></div><small>${v?v+' kg':'–'}</small></div>`).join('')}</div>`}));h+='<h2>Historie</h2>';if(!S.sessions.length)h+='<p class="muted">Noch keine neu beendeten Sessions.</p>';S.sessions.slice().reverse().forEach(s=>{const [w,d]=String(s.key).split('|');h+=`<div class="panel"><b>Woche ${esc(w)} · ${esc(D[d]?.n||'Training')}</b><br><small>${esc(new Date(s.end).toLocaleString('de-DE'))} · ${fmt(s.seconds)}</small></div>`});h+='<h3>Frühere Zeitmessungen</h3>';Object.entries(S.dur).forEach(([k,v])=>{const [w,d]=k.split('|');h+=`<p>W${esc(w)} · ${esc(D[d]?.n||'Training')} · ${fmt(v)}</p>`});$('#history').innerHTML=h}
function startRest(s){restSecs=s;restEnd=Date.now()+s*1000;tick()}function tick(){const r=S.running;$('#session').textContent=r?'Training beenden':'Training starten';$('#sessionTime').textContent=r?fmt((Date.now()-r.start)/1000):fmt(S.dur[prefix()]||0);$('#restTime').textContent=fmt(Math.ceil((restEnd-Date.now())/1000));$('#restLabel').textContent=restEnd&&restEnd<=Date.now()?'Pause beendet': 'Satzpause';$('#restStart').textContent=restSecs+' s Pause'}setInterval(tick,250);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;['train','history','settings'].forEach(v=>$('#'+v).hidden=v!==view);document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));if(view==='history')stats()}else if(b.dataset.week||b.dataset.day!==undefined){if(b.dataset.week)S.week=+b.dataset.week;else S.day=+b.dataset.day;save();render()}else if(b.dataset.pause)startRest(+b.dataset.pause)});document.addEventListener('input',e=>{const t=e.target;if(t.dataset.m){S.mx[t.dataset.m]=t.value;save()}else if(t.dataset.k){const v=S.log[t.dataset.k]||(S.log[t.dataset.k]={});v[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;save();progress();if(t.checked&&t.dataset.rest)startRest(+t.dataset.rest)}});$('#session').onclick=()=>{if(S.running){const r=S.running,end=Date.now(),seconds=Math.round((end-r.start)/1000);S.dur[r.key]=seconds;S.sessions.push({key:r.key,start:r.start,end,seconds});delete S.running}else S.running={key:prefix(),start:Date.now()};save();tick()};$('#restStart').onclick=()=>startRest(restSecs);$('#restStop').onclick=()=>{restEnd=0;tick()};$('#reset').onclick=()=>{if(confirm('Alle Einträge dieses Tages löschen?')){Object.keys(S.log).filter(k=>k.startsWith(prefix()+'|')).forEach(k=>delete S.log[k]);save();render()}};function maxes(){$('#maxes').innerHTML=[['bp','Bankdrücken'],['pp','Push Press']].map(([k,n])=>`<label class="set"><span>${n}</span><input class="rm" data-m="${k}" inputmode="decimal" value="${esc(S.mx[k])}" placeholder="kg"></label>`).join('')}$('#export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=u;a.download='rb-training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!valid(o))throw Error();if(confirm('Lokale Daten durch Backup ersetzen?')){load(o);save();maxes();render()}}catch(e){alert('Backup konnte nicht gelesen werden.')}finally{$('#file').value=''}};maxes();render();
</script></body></html>
